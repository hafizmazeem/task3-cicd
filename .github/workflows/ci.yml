name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Pull code
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements.txt ruff pytest
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -q
      - name: Build image
        run: docker build -t myapp:${{ github.sha }} .
      - name: Status summary
        if: always()
        run: |
          echo "### Pipeline result" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
